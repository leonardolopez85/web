<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo Virtual - Grupo 5</title>
    <!-- Tailwind CSS para el diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: #0f172a; /* Fondo oscuro por si no carga la imagen */
            overflow-x: hidden;
        }

        h1, h2, h3, .serif-text {
            font-family: 'Playfair Display', serif;
        }

        /* Fondo fijo para evitar lag en celulares */
        .fondo-fijo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.95)), url('Chimborazo.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Tarjetas estilo cristal (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Efectos para los modales (ventanas emergentes) */
        .modal-glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
        }

        /* Ocultar barra de scroll pero permitir scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="text-white min-h-screen pb-20">

    <div class="fondo-fijo"></div>

    <!-- Encabezado del Museo -->
    <header class="text-center pt-16 pb-10 px-4">
        <p class="text-orange-400 font-semibold tracking-widest uppercase text-sm mb-2">Grupo 5</p>
        <h1 class="text-4xl md:text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-orange-300 to-yellow-500">
            Museo Virtual
        </h1>
        <p class="text-lg md:text-xl font-light text-gray-300 max-w-2xl mx-auto serif-text italic">
            "Literatura y arte ecuatoriano: un viaje por nuestras raíces y nuestra identidad"
        </p>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- SECCIÓN: LITERATURA -->
        <div class="mb-16">
            <h2 class="text-3xl border-b border-gray-600 pb-2 mb-8 text-orange-400 flex items-center gap-3">
                <i class="fa-solid fa-book-open"></i> Pabellón de Literatura
            </h2>
            <!-- El contenedor donde el JavaScript inyectará a los escritores -->
            <div id="grid-literatura" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                <!-- Generado por JS -->
            </div>
        </div>

        <!-- SECCIÓN: ARTE -->
        <div class="mb-16">
            <h2 class="text-3xl border-b border-gray-600 pb-2 mb-8 text-cyan-400 flex items-center gap-3">
                <i class="fa-solid fa-palette"></i> Pabellón de Arte
            </h2>
            <!-- El contenedor donde el JavaScript inyectará a los pintores -->
            <div id="grid-arte" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                <!-- Generado por JS -->
            </div>
        </div>

    </main>

    <!-- Este panel está oculto por defecto y se abre al hacer clic -->
    <div id="museum-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 opacity-0 transition-opacity duration-300">
        <!-- Fondo oscuro clickeable para cerrar -->
        <div class="absolute inset-0 bg-black/70" onclick="cerrarModal()"></div>
        
        <!-- Contenedor principal del modal -->
        <div class="modal-glass w-full max-w-5xl max-h-[90vh] overflow-y-auto no-scrollbar relative z-10 p-6 md:p-10 animate-fade-in shadow-2xl flex flex-col md:flex-row gap-8">
            
            <!-- Botón Cerrar -->
            <button onclick="cerrarModal()" class="absolute top-4 right-4 md:top-6 md:right-6 text-gray-400 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-10 h-10 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <!-- Izquierda: Info del Artista -->
            <div class="w-full md:w-1/3 flex flex-col items-center md:items-start text-center md:text-left">
                <img id="modal-img" src="" alt="Artista" class="w-40 h-40 md:w-56 md:h-56 object-cover rounded-full border-4 border-gray-600 shadow-lg mb-6">
                <h3 id="modal-name" class="text-3xl font-bold mb-1">Nombre</h3>
                <p id="modal-role" class="text-orange-400 font-medium mb-4 tracking-wide uppercase text-sm">Rol</p>
                <p id="modal-bio" class="text-gray-300 text-sm leading-relaxed mb-6">Biografía va aquí...</p>
            </div>

            <!-- Derecha: Las Obras -->
            <div class="w-full md:w-2/3 border-t md:border-t-0 md:border-l border-gray-600/50 pt-6 md:pt-0 md:pl-8">
                <h4 class="text-2xl mb-6 serif-text text-white flex items-center gap-2">
                    <i class="fa-solid fa-crown text-yellow-500 text-lg"></i> Obras Destacadas
                </h4>
                
                <!-- Contenedor de las 3 obras -->
                <div id="modal-works" class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <!-- Obras generadas por JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // Aquí está toda la información de los autores y sus obras
        const baseDeDatos = [
            // --- LITERATURA ---
            {
                id: "icaza",
                categoria: "literatura",
                nombre: "Jorge Icaza",
                rol: "Novelista, Indigenismo",
                bio: "Destacado escritor quiteño, famoso por exponer la cruda realidad de la explotación indígena en los Andes ecuatorianos. Su obra cumbre 'Huasipungo' es un pilar de la literatura.",
                imagenPerfil: "./Imagenes/jorgeicaza.avif",
                obras: [
                    { titulo: "Huasipungo", año: "1934", img: "./Imagenes/jorgeicaza-huasipungo.jpg" },
                    { titulo: "El Chulla Romero", año: "1958", img: "./Imagenes/jorgeicaza-chulla.webp" },
                    { titulo: "En las calles", año: "1935", img: "./Imagenes/jorgeicaza-calles.jpg" }
                ]
            },
            {
                id: "montalvo",
                categoria: "literatura",
                nombre: "Juan Montalvo",
                rol: "Ensayista y Novelista",
                bio: "Pensador ambateño, maestro de la pluma. Luchó incansablemente contra las dictaduras con sus escritos liberales y fuertemente anticlericales, defendiendo la libertad.",
                imagenPerfil: "./Imagenes/juanmontalvo.jpg",
                obras: [
                    { titulo: "Las Catilinarias", año: "1880", img: "./Imagenes/juanmontalvo-catilinarias.webp" },
                    { titulo: "Siete Tratados", año: "1882", img: "./Imagenes/juanmontalvo-tratados.jpg" },
                    { titulo: "Capítulos que se le olvidaron a Cervantes", año: "1895", img: "./Imagenes/juanmontalvo-cervantes.jpg" }
                ]
            },
            {
                id: "silva",
                categoria: "literatura",
                nombre: "Medardo Ángel Silva",
                rol: "Poeta, Gen. Decapitada",
                bio: "Joven poeta guayaquileño. Su poesía modernista, cargada de melancolía, lo convirtió en una leyenda de la literatura nacional. Muchos de sus poemas se volvieron pasillos.",
                imagenPerfil: "./Imagenes/medardoangelsilva.png",
                obras: [
                    { titulo: "El árbol del bien y del mal", año: "1918", img: "https://placehold.co/300x450/1e293b/fb923c?text=El+Arbol" },
                    { titulo: "María Jesús", año: "1919", img: "https://placehold.co/300x450/1e293b/fb923c?text=Maria+Jesus" },
                    { titulo: "Trompetas de oro", año: "Poesía", img: "https://placehold.co/300x450/1e293b/fb923c?text=Trompetas+de+oro" }
                ]
            },
            {
                id: "veintimilla",
                categoria: "literatura",
                nombre: "Dolores Veintimilla",
                rol: "Poeta, Romanticismo",
                bio: "Poeta quiteña pionera del romanticismo en Ecuador. Su obra está marcada por el dolor, la incomprensión de la sociedad de su época y el feminismo temprano.",
                imagenPerfil: "./Imagenes/doloresveintimilla.png",
                obras: [
                    { titulo: "Quejas", año: "Poema", img: "https://placehold.co/300x450/1e293b/fb923c?text=Quejas" },
                    { titulo: "A mis enemigos", año: "Poema", img: "https://placehold.co/300x450/1e293b/fb923c?text=A+mis+enemigos" },
                    { titulo: "Sufrimiento", año: "Poema", img: "https://placehold.co/300x450/1e293b/fb923c?text=Sufrimiento" }
                ]
            },
            // --- ARTE ---
            {
                id: "guayasamin",
                categoria: "arte",
                nombre: "Oswaldo Guayasamín",
                rol: "Pintor y Muralista",
                bio: "El pintor más universal del Ecuador. Su obra retrata el dolor y la esperanza de los pueblos indígenas y mestizos de América Latina con gran fuerza expresionista.",
                imagenPerfil: "./Imagenes/guayasamin.jpg",
                obras: [
                    { titulo: "Los Trabajadores", año: "Pintura", img: "./Imagenes/guayasamin-trabajadores.jpg" },
                    { titulo: "La Edad de la Ira", año: "Serie", img: "./Imagenes/guayasamin-ira.jpg" },
                    { titulo: "La Ternura", año: "Serie", img: "./Imagenes/guayasamin-ternura.jpg" }
                ]
            },
            {
                id: "kingman",
                categoria: "arte",
                nombre: "Eduardo Kingman",
                rol: "Pintor (Mano Grande)",
                bio: "Maestro del expresionismo e indigenismo. Famoso por pintar manos grandes y fuertes, reflejo del duro trabajo del pueblo campesino e indígena del Ecuador.",
                imagenPerfil: "./Imagenes/eduardokingman.jpg",
                obras: [
                    { titulo: "Los Guandos", año: "Pintura", img: "https://placehold.co/400x300/1e293b/22d3ee?text=Los+Guandos" },
                    { titulo: "Mirada Hacia el Sur", año: "Pintura", img: "https://placehold.co/400x300/1e293b/22d3ee?text=Mirada+al+Sur" },
                    { titulo: "La Hora Oscura", año: "Pintura", img: "https://placehold.co/400x300/1e293b/22d3ee?text=Hora+Oscura" }
                ]
            },
            {
                id: "egas",
                categoria: "arte",
                nombre: "Camilo Egas",
                rol: "Pintor Vanguardista",
                bio: "Pionero del arte moderno en Ecuador. Fue el primero en llevar la figura del indígena al lienzo con una estética vanguardista e internacional.",
                imagenPerfil: "./Imagenes/camiloegas.jpg",
                obras: [
                    { titulo: "Las Floristas", año: "Pintura", img: "https://placehold.co/400x300/1e293b/22d3ee?text=Las+Floristas" },
                    { titulo: "Trabajadores sin hogar", año: "Pintura", img: "https://placehold.co/400x300/1e293b/22d3ee?text=Trabajadores" },
                    { titulo: "Calle 14", año: "Pintura", img: "https://placehold.co/400x300/1e293b/22d3ee?text=Calle+14" }
                ]
            }
        ];

        
        // 1. Dibuja los cuadros en la página principal
        function cargarMuseo() {
            const gridLit = document.getElementById('grid-literatura');
            const gridArte = document.getElementById('grid-arte');

            baseDeDatos.forEach(artista => {
                // Color del borde dependiendo si es Literatura (naranja) o Arte (cyan)
                const colorTema = artista.categoria === 'literatura' ? 'border-orange-500/50' : 'border-cyan-500/50';
                
                const tarjetaHTML = `
                    <div onclick="abrirModal('${artista.id}')" class="glass-card flex flex-col items-center p-6 text-center border-b-4 ${colorTema}">
                        <img src="${artista.imagenPerfil}" alt="${artista.nombre}" class="w-24 h-24 rounded-full mb-4 shadow-lg border-2 border-gray-400">
                        <h3 class="text-xl font-bold text-white leading-tight mb-1">${artista.nombre}</h3>
                        <p class="text-xs text-gray-400 uppercase tracking-wider">${artista.rol}</p>
                    </div>
                `;

                if(artista.categoria === 'literatura') gridLit.innerHTML += tarjetaHTML;
                else gridArte.innerHTML += tarjetaHTML;
            });
        }

        // 2. Lógica para abrir la ventana de detalles
        const modal = document.getElementById('museum-modal');
        
        function abrirModal(idArtista) {
            // Buscar la info del artista
            const artista = baseDeDatos.find(a => a.id === idArtista);
            
            // Llenar los datos de la izquierda (Bio)
            document.getElementById('modal-img').src = artista.imagenPerfil;
            document.getElementById('modal-name').innerText = artista.nombre;
            document.getElementById('modal-role').innerText = artista.rol;
            document.getElementById('modal-bio').innerText = artista.bio;
            
            // Llenar las 3 obras
            const contenedorObras = document.getElementById('modal-works');
            contenedorObras.innerHTML = ''; // Limpiar anteriores
            
            artista.obras.forEach(obra => {
                contenedorObras.innerHTML += `
                    <div class="bg-gray-800/50 rounded-xl overflow-hidden border border-gray-600/50 shadow-md hover:scale-105 transition-transform duration-300">
                        <img src="${obra.img}" alt="${obra.titulo}" class="w-full h-48 md:h-56 object-cover">
                        <div class="p-4 text-center">
                            <h5 class="font-bold text-sm text-white mb-1 leading-tight">${obra.titulo}</h5>
                            <p class="text-xs text-gray-400">${obra.año}</p>
                        </div>
                    </div>
                `;
            });

            // Mostrar el modal con animación suave
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden'; // Evitar scroll de fondo
        }

        // 3. Lógica para cerrar
        function cerrarModal() {
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto'; // Restaurar scroll
            }, 300); // Esperar que termine la animación
        }

        // Arrancar la página
        cargarMuseo();
    </script>
</body>
</html>
